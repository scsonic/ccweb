<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CO3D - Earth Observation Satellite Constellation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="canvas-container"></div>

    <!-- RPG-style Dialog Box -->

        </div>
        <div id="dialog-content">
            <div id="dialog-header">Dr. Earth - Space Scientist</div>
            <div id="dialog-text">Welcome! Click on Earth to see coordinates, or click on satellites to learn about the CO3D constellation.</div>
            <div id="dialog-images"></div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {

        }
    }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
